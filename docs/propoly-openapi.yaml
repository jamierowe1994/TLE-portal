              examples:
                not_found_example:
                  value:
                    status: error
                    message: Deal not found
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Deal not found
        '409':
          description: Conflict - Duplicate document
          content:
            application/json:
              examples:
                conflict_example:
                  value:
                    status: error
                    message: A Gas Safety Attachment already exists for this deal
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    description: Document already exists

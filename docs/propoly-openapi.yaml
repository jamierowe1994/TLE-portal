              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                unprocessable_entity_example:
                  value:
                    status: error
                    message: Failed to upload document
                    errors:
                    - Attached file can't be blank
                    - Type is invalid
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    description: Various validation error messages
                    examples:
                    - Failed to upload document
                    - A document of this type already exists for this deal

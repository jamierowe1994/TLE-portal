  "/api/v1/token":
    get:
      summary: Generates JWT Token
      tags:
      - Authentication
      parameters:
      - name: x-api-key
        in: header
        required: true
        description: API Key provided to agents
        schema:
          type: string
      - name: agent-name
        in: header
        required: true
        description: Agent Name
        schema:
          type: string
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT authentication token
                  client_name:
                    type: string
                    description: Authenticated client name
                required:
                - token
                - client_name
        '403':
          description: Invalid credentials

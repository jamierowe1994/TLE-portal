                        format: uuid
                      type:
                        type: string
                      name:
                        type: string
                      expiration:
                        type: string
                        format: date
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                bad_request_example:
                  value:
                    status: error
                    message: Gas Safety Certificate cannot be uploaded - this property
                      does not have gas enabled
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    description: Bad request - various validation errors
                    examples:
                    - Expiration date is required for Compliance Documents
                    - Gas Safety Certificate cannot be uploaded - this property does
                      not have gas enabled
                    - Portable appliance test can only be uploaded for Scottish properties
                    - Legionella risk assessment can only be uploaded for Scottish
                      properties
                    - File size exceeds the maximum allowed size of 8.5MB
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized_example:
                  value:
                    status: error
                    message: Unauthorized
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '403':
          description: Forbidden
          content:

              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    description: File size exceeds limit
                    example: File size 10.2MB exceeds the maximum allowed size of
                      8.5MB
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                internal_server_error_example:
                  value:
                    status: error
                    message: An error occurred while creating the document
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: An error occurred while creating the document
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              description: Document upload payload. Compliance documents (Gas Safety,
                EPC, Electrical Installation, Portable Appliance Test, Legionella)
              properties:
                deal_id:
                  type: string
                  format: uuid
                  description: UUID of the deal
                  example: 239cfa6-42d0-4a13-bf6d-17acf0491c83
                attached:
                  type: string
                  format: binary
                  description: File to upload (PDF, JPG, PNG, etc.)

---
openapi: 3.0.1
info:
  title: API V1 (Production)
  version: v1
paths:
  "/api/v1/agents":
    get:
      summary: Retrieve all Agents
      tags:
      - Agents
      security:
      - bearer_auth: []
      parameters:
      - name: x-api-key
        in: header
        required: true
        description: API Key provided to agents
        schema:
          type: string
      - name: agent-name
        in: header
        required: true
        description: Agent Name
        schema:
          type: string
      - name: created_at_from
        in: query
        required: false
        description: 'Filter records created from this date (inclusive). Format: YYYY-MM-DD
          or ISO 8601 (example: 2024-01-15)'
        example: ''
        schema:
          type: string
      - name: created_at_to
        in: query
        required: false
        description: 'Filter records created up to this date (inclusive). Format:
          YYYY-MM-DD or ISO 8601 (example: 2024-01-20)'
        example: ''
        schema:
          type: string
      - name: updated_at_from
        in: query
        required: false
        description: 'Filter records updated from this date (inclusive). Format: YYYY-MM-DD
          or ISO 8601 (example: 2024-01-15)'
        example: ''
        schema:
          type: string
      - name: updated_at_to
        in: query
        required: false
        description: 'Filter records updated up to this date (inclusive). Format:
          YYYY-MM-DD or ISO 8601 (example: 2024-01-20)'
        example: ''
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number for pagination
        example: 1
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of records per page
        example: 10
        schema:
          type: integer
      responses:
        '200':
          description: agents found with custom pagination
          content:
            application/json:
              examples:
                example_response:
                  value:
                    agents:
                    - uuid: 123e4567-e89b-12d3-a456-426614174000
                      first_name: John
                      last_name: Doe
                      email: john.doe@email.com
                      mobileno: "+447777777777"
                      title: Mr.
                      created_at: '2024-07-12T10:00:00Z'
                      updated_at: '2024-07-12T10:00:00Z'
                    total_entries: 1
                    per_page: 10
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          format: uuid
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
                          format: email
                        mobileno:
                          type: string
                        title:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  total_entries:
                    type: integer
                  per_page:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                unauthorized_example:
                  value:
                    status: error
                    message: Unauthorized
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '403':
          description: Forbidden
          content:
            application/json:
              examples:
                forbidden_example:
                  value:
                    status: error
                    message: Incorrect credentials.
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '404':
          description: agents not found
          content:
            application/json:
              examples:
                not_found_example:
                  value:
                    status: error
                    message: Not found
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                unprocessable_entity_example:
                  value:
                    status: error
                    message: Unprocessable Entity
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
